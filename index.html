  <script>
    (function () {
      var replacements = [
        ['H2O <-> H+ + OH-', '$H_2O \\rightleftharpoons H^+ + OH^-$'],
        ['Kw = [H+][OH-] = 1.0x10^-14 at 25degC', '$K_w=[H^+][OH^-]=1.0\\times10^{-14}$ at $25^\\circ\\mathrm{C}$'],
        ['Kw = [H+][OH-] = 1.0x10^-14', '$K_w=[H^+][OH^-]=1.0\\times10^{-14}$'],
        ['pH + pOH = 14', '$pH+pOH=14$'],
        ['pH itself is just -log[H+]', 'pH itself is just $-\\log[H^+]$'],
        ['pH = -log[H+]', '$pH=-\\log[H^+]$'],
        ['pOH = -log[OH-]', '$pOH=-\\log[OH^-]$']
      ];

      function normalizeWaterIonization(root) {
        if (!root) return;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var nodes = [];
        while (walker.nextNode()) {
          var n = walker.currentNode;
          var p = n.parentElement;
          if (p && !p.closest('.katex, code, pre')) nodes.push(n);
        }
        nodes.forEach(function (node) {
          var text = node.nodeValue;
          replacements.forEach(function (pair) {
            if (text.indexOf(pair[0]) !== -1) text = text.split(pair[0]).join(pair[1]);
          });
          if (text !== node.nodeValue) node.nodeValue = text;
        });
      }

      function renderStudyMath() {
        var app = document.getElementById('app');
        if (!app || typeof renderMathInElement !== 'function') return;
        normalizeWaterIonization(app);
        renderMathInElement(app, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }

      var app = document.getElementById('app');
      if (app) new MutationObserver(function () { renderStudyMath(); }).observe(app, {childList:true, subtree:true});
      window.addEventListener('load', renderStudyMath);
    })();
  </script>
