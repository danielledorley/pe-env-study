  <script>
    // Normalize the Study Guide's legacy plain-text equations into LaTeX
    // before KaTeX renders. This keeps the existing study-guide prose intact
    // while giving every formula the same polished mathematical treatment.
    (function () {
      function normalizePlainMath(root) {
        if (!root) return;
        var replacements = [
          ['6.022x10^23', '$6.022\\times10^{23}$'],
          ['mg/L = (mol/L) x (molecular weight, g/mol) x 1,000', '$mg/L=(mol/L)\\times(MW\\,/\\,g\\!\\cdot\\!mol^{-1})\\times1{,}000$'],
          ['Kw = [H+][OH-] = 1.0x10^-14', '$K_w=[H^+][OH^-]=1.0\\times10^{-14}$'],
          ['pH + pOH = 14', '$pH+pOH=14$'],
          ['pH = -log[H+]', '$pH=-\\log[H^+]$'],
          ['C = C0 x e^(-kt)', '$C=C_0e^{-kt}$'],
          ['C = C0 e^(-kt) form', '$C=C_0e^{-kt}$ form'],
          ['C = C0 e^(-kt) form especially close', '$C=C_0e^{-kt}$ form especially close'],
          ['PV = nRT', '$PV=nRT$'],
          ['efficiency = (Cin - Cout)/Cin', '$\\mathrm{efficiency}=(C_{in}-C_{out})/C_{in}$'],
          ['CR = Vi/Vf', '$CR=V_i/V_f$'],
          ['[(Vi - Vf)/Vi] x 100', '$[(V_i-V_f)/V_i]\\times100$'],
          ['SWp = SWi + p/(a + bp)', '$SW_p=SW_i+\\dfrac{p}{a+bp}$'],
          ['nu = mu/rho', '$\\nu=\\mu/\\rho$'],
          ['A1v1 = A2v2', '$A_1v_1=A_2v_2$'],
          ['Q = Av', '$Q=Av$'],
          ['v^2/2g', '$v^2/(2g)$'],
          ['P/gamma', '$P/\\gamma$'],
          ['Q = Cd x A x sqrt(2gh)', '$Q=C_dA\\sqrt{2gh}$'],
          ['v = (1.49/n) R^(2/3) S^(1/2)', '$v=(1.49/n)R^{2/3}S^{1/2}$'],
          ['Q = CiA', '$Q=CiA$'],
          ['Q = KAi', '$Q=KAi$'],
          ['v = Ki', '$v=Ki$'],
          ['Fr < 1', '$Fr<1$'],
          ['Fr = 1', '$Fr=1$'],
          ['Fr > 1', '$Fr>1$'],
          ['T = K x b', '$T=Kb$'],
          ['T = K x b', '$T=Kb$'],
          ['v_c=v_s/R', '$v_c=v_s/R$'],
          ['v_c = v_s/R', '$v_c=v_s/R$'],
          ['N = N0 x (1/2)^(t/half-life)', '$N=N_0(1/2)^{t/t_{1/2}}$'],
          ['F = P(1+i)^n', '$F=P(1+i)^n$'],
          ['P = F/(1+i)^n', '$P=F/(1+i)^n$'],
          ['Capitalized Cost = A/i', '$\\mathrm{Capitalized\\ Cost}=A/i$'],
          ['B/C = present worth of benefits / present worth of costs', '$B/C=PW_{benefits}/PW_{costs}$'],
          ['breakeven units = Fixed Costs / (Price per unit - Variable cost per unit)', '$Q_{BE}=F/(p-v)$'],
          ['Cost_new = Cost_old x (Index_new / Index_old)', '$Cost_{new}=Cost_{old}(Index_{new}/Index_{old})$'],
          ['annual depreciation = (Cost - Salvage Value) / Useful Life', '$D=(C-S)/N$'],
          ['effective rate = (1 + nominal/m)^m - 1', '$i_{eff}=(1+i_{nom}/m)^m-1$'],
          ['F = Pe^(rn)', '$F=Pe^{rn}$'],
          ['TMDL = waste load allocation + load allocation + margin of safety', '$TMDL=WLA+LA+MOS$'],
          ['backwash volume = filter area x rise rate x backwash time x number of filters', '$V_{backwash}=A_f r t N$'],
          ['dose = demand + residual', '$D=Demand+Residual$'],
          ['Total hardness = carbonate hardness + non-carbonate hardness', '$TH=CH+NCH$'],
          ['hardness = carbonate hardness + non-carbonate hardness', '$TH=CH+NCH$'],
          ['alkalinity = bicarbonate + carbonate', '$Alk\\approx[HCO_3^-]+[CO_3^{2-}]$'],
          ['lb/day = dose (mg/L) x flow (MGD) x 8.34', '$W_{lb/day}=8.34QC$'],
          ['lb/day = concentration x flow x 8.34', '$W_{lb/day}=8.34QC$'],
          ['lb/day = mg/L x MGD x 8.34', '$W_{lb/day}=8.34QC$'],
          ['BOD5) = initial DO minus final DO', '$BOD_5=DO_i-DO_f$'],
          ['SRT = total solids in the system divided by solids wasted per day', '$SRT=\\dfrac{\\text{total solids in system}}{\\text{solids wasted per day}}$'],
          ['V = Qt', '$V=Qt$'],
          ['V=Qt', '$V=Qt$'],
          ['Koc = 0.63 x Kow', '$K_{oc}=0.63K_{ow}$'],
          ['R = 1 + (bulk density / porosity) x Kd', '$R=1+(\\rho_b/n)K_d$'],
          ['Q = KAi, or v = Ki', '$Q=KAi$, or $v=Ki$'],
          ['T = K x b', '$T=Kb$'],
          ['IR = (number of recordable incidents x 200,000) / total hours worked', '$IR=\\dfrac{N_i\\times200{,}000}{H}$'],
          ['I2 = I1 x (d1/d2)^2', '$I_2=I_1(d_1/d_2)^2$']
        ];

        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: function (node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            var p = node.parentElement;
            if (!p || p.closest('.katex, code, pre')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function (node) {
          var text = node.nodeValue;
          replacements.forEach(function (pair) {
            if (text.indexOf(pair[0]) !== -1) text = text.split(pair[0]).join(pair[1]);
          });
          if (text !== node.nodeValue) node.nodeValue = text;
        });
      }

      function renderGuideMath() {
        if (typeof renderMathInElement !== 'function') return;
        var app = document.getElementById('app');
        if (!app) return;
        normalizePlainMath(app);
        renderMathInElement(app, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }

      var app = document.getElementById('app');
      if (app) {
        new MutationObserver(function () { renderGuideMath(); }).observe(app, { childList: true, subtree: true });
      }
      window.addEventListener('load', renderGuideMath);
    })();
  </script>
</body>
